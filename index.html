<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRS · Solicitudes</title>
<style>
  :root{
    --verde-oscuro:#1f3d2e;
    --verde:#2f6b4f;
    --verde-claro:#e8f0ea;
    --arena:#f6f4ef;
    --tinta:#20241f;
    --gris:#6b7268;
    --borde:#dbe2dc;
    --rojo:#b3452f;
    --amarillo:#a9782c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--arena);
    color:var(--tinta);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    padding:20px 16px 14px;
    background:var(--verde-oscuro);
    color:#fff;
    position:sticky;
    top:0;
    z-index:6;
  }
  header h1{ margin:0; font-size:19px; font-weight:650; }
  header p{ margin:4px 0 0; font-size:12.5px; color:#c9dccf; }

  .summary{
    display:flex; gap:8px; padding:12px 16px; overflow-x:auto;
    background:#fff; border-bottom:1px solid var(--borde);
  }
  .summary .chip{
    flex:0 0 auto; background:var(--verde-claro); color:var(--verde-oscuro);
    border-radius:10px; padding:8px 12px; font-size:12px; font-weight:600; white-space:nowrap;
  }
  .summary .chip b{ display:block; font-size:16px; font-weight:750; }
  .summary .chip.ejecutar{ background:#f3ead9; color:var(--amarillo); }

  #controls{
    background:#fff; border-bottom:1px solid var(--borde);
    padding:10px 16px 12px; position:sticky; top:74px; z-index:5;
  }
  .controls-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .controls-row + .controls-row{ margin-top:2px; }
  .ctrl{ flex:0 0 auto; display:flex; flex-direction:column; gap:2px; }
  .ctrl label{ font-size:10px; color:var(--gris); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; }
  .ctrl select, .ctrl input{
    font-size:12.5px; padding:6px 8px; border-radius:7px; border:1px solid var(--borde);
    background:var(--arena); color:var(--tinta); min-width:132px;
  }
  #clearFilters{
    align-self:flex-end; border:1px solid var(--rojo); color:var(--rojo); background:#fff;
    border-radius:7px; font-size:11.5px; padding:6px 10px; white-space:nowrap;
  }
  #order-dir{ min-width:auto; width:76px; }

  #board{ display:flex; gap:12px; padding:14px 16px 40px; overflow-x:auto; scroll-snap-type:x proximity; }
  .col{ flex:0 0 280px; scroll-snap-align:start; }
  .col-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 4px 8px; border-bottom:2px solid var(--verde); margin-bottom:10px;
  }
  .col-head h2{ font-size:13px; margin:0; font-weight:700; color:var(--verde-oscuro); }
  .col-head span{ font-size:12px; background:var(--verde); color:#fff; border-radius:20px; padding:1px 8px; font-weight:700; }

  .card{
    background:#fff; border:1px solid var(--borde); border-left:4px solid var(--verde);
    border-radius:8px; padding:10px 12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .card.durango{ border-left-color:var(--amarillo); }
  .card.sonora{ border-left-color:var(--rojo); }
  .card .cliente{ font-size:13.5px; font-weight:650; margin:0 0 2px; line-height:1.3; }
  .card .codigo{ font-size:11px; color:var(--gris); font-variant-numeric:tabular-nums; margin-bottom:6px; }
  .card .meta{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:6px; }
  .tag{ font-size:10.5px; padding:2px 7px; border-radius:20px; background:var(--verde-claro); color:var(--verde-oscuro); font-weight:600; }
  .tag.resp{ background:#eef0e6; color:#4b4f3d; }
  .card .accion{ font-size:12px; color:var(--tinta); border-top:1px dashed var(--borde); padding-top:6px; margin-top:2px; }
  .card .accion b{ color:var(--verde-oscuro); }
  .card .monto{ font-size:13px; font-weight:700; color:var(--verde-oscuro); margin-top:4px; }
  .card .descripcion{ font-size:12px; color:var(--tinta); line-height:1.4; margin-bottom:6px; }
  .card .termino{ font-size:11px; color:var(--amarillo); font-weight:600; margin-top:4px; }
  .card .montos{ margin-top:4px; border-top:1px solid var(--borde); padding-top:6px; }
  .card .monto-linea{
    display:flex; justify-content:space-between; gap:8px;
    font-size:11.5px; color:var(--gris); padding:1px 0;
  }
  .card .monto-linea b{ color:var(--verde-oscuro); font-weight:700; font-variant-numeric:tabular-nums; }
  .card .monto-linea.ejecutar b{ color:var(--amarillo); }
  .card .monto-linea.cobrar b{ color:var(--rojo); }
  .card .detail-toggle{
    font-size:11px; color:var(--verde); font-weight:700; margin-top:8px; cursor:pointer;
    user-select:none; display:flex; align-items:center; gap:4px;
  }
  .card .detail-toggle:hover{ text-decoration:underline; }
  .card .detail{ margin-top:6px; padding-top:8px; border-top:1px dashed var(--borde); }
  .card .detail-line{ font-size:11.5px; color:var(--tinta); margin-bottom:6px; }
  .card .detail-line:last-child{ margin-bottom:0; }
  .card .detail-line span{
    display:block; font-size:10px; color:var(--gris); font-weight:700;
    text-transform:uppercase; letter-spacing:0.3px; margin-bottom:1px;
  }
  .card .detail-line.notas div{ background:#f3ead9; border-radius:6px; padding:5px 7px; }
  .empty-col, .empty-board{ font-size:12px; color:var(--gris); padding:12px 4px; font-style:italic; }
  #status-bar{ text-align:center; font-size:11.5px; color:var(--gris); padding:0 16px 18px; }
  #refresh{
    background:none; border:1px solid #3f6b53; color:#dcefe3; border-radius:20px;
    font-size:11.5px; padding:5px 12px; margin-top:10px;
  }
  .loading, .error{ padding:30px 16px; text-align:center; color:var(--gris); font-size:13px; }

  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--verde-oscuro); padding:16px;
  }
  #login-screen[hidden]{ display:none; }
  .login-card{
    background:#fff; border-radius:12px; padding:28px 24px; width:100%; max-width:320px;
    box-shadow:0 4px 18px rgba(0,0,0,0.18);
  }
  .login-card h1{ margin:0 0 4px; font-size:17px; color:var(--verde-oscuro); }
  .login-card p{ margin:0 0 18px; font-size:12px; color:var(--gris); }
  .login-card label{ display:block; font-size:11px; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:0.3px; margin:12px 0 4px; }
  .login-card input{
    width:100%; font-size:14px; padding:9px 10px; border-radius:7px; border:1px solid var(--borde);
    background:var(--arena); color:var(--tinta);
  }
  .login-card button{
    width:100%; margin-top:18px; background:var(--verde); color:#fff; border:none;
    border-radius:8px; padding:10px; font-size:14px; font-weight:650; cursor:pointer;
  }
  .login-card button:disabled{ opacity:0.6; }
  .login-error{ color:var(--rojo); font-size:12px; margin-top:10px; min-height:14px; }
  #app[hidden]{ display:none; }
  .session-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-top:8px; font-size:11px; color:#a9c2b1;
  }
  #logout{
    background:none; border:1px solid #3f6b53; color:#dcefe3; border-radius:20px;
    font-size:11px; padding:4px 10px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-card" id="login-form">
    <h1>Solicitudes de Clientes</h1>
    <p>Acceso restringido — inicia sesión para continuar.</p>
    <label for="login-email">Correo</label>
    <input type="email" id="login-email" autocomplete="username" required>
    <label for="login-password">Contraseña</label>
    <input type="password" id="login-password" autocomplete="current-password" required>
    <button type="submit" id="login-submit">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<div id="app" hidden>

<header>
  <h1>Solicitudes de Clientes</h1>
  <p id="subtitle">Cargando datos en vivo desde Supabase…</p>
  <p style="margin:2px 0 0; font-size:11px; color:#a9c2b1; font-style:italic;">*Todos los montos son antes de IVA</p>
  <div class="session-bar">
    <span id="session-email"></span>
    <span style="display:flex; gap:8px; align-items:center;">
      <button id="refresh">↻ Actualizar</button>
      <button id="logout">Salir</button>
    </span>
  </div>
</header>

<div class="summary" id="summary"></div>

<div id="controls">
  <div class="controls-row">
    <div class="ctrl"><label>Cliente</label><select id="f-cliente"><option value="">Todos</option></select></div>
    <div class="ctrl"><label>Código</label><select id="f-codigo"><option value="">Todos</option></select></div>
    <div class="ctrl"><label>Estado</label><select id="f-estado"><option value="">Todos</option></select></div>
    <div class="ctrl"><label>Unidad de negocio</label><select id="f-unidad"><option value="">Todas</option></select></div>
  </div>
  <div class="controls-row">
    <div class="ctrl"><label>Responsable</label><select id="f-responsable"><option value="">Todos</option></select></div>
    <div class="ctrl"><label>Canal de entrada</label><select id="f-canal"><option value="">Todos</option></select></div>
    <div class="ctrl"><label>Status</label><select id="f-status"><option value="">Todos</option></select></div>
    <button id="clearFilters">Limpiar filtros</button>
  </div>
  <div class="controls-row">
    <div class="ctrl"><label>Ordenar por</label>
      <select id="order-field">
        <option value="pipeline">Pipeline (default)</option>
        <option value="monto_cotizacion">Monto de cotización</option>
        <option value="costo_presupuestado">Costo presupuestado</option>
        <option value="proxima_accion">Próxima acción</option>
        <option value="responsable">Responsable</option>
        <option value="cliente">Cliente</option>
        <option value="codigo">Código</option>
        <option value="created_at">Fecha de captura</option>
        <option value="fecha_termino_tentativa">Fecha de término tentativa</option>
      </select>
    </div>
    <div class="ctrl"><label>Dirección</label>
      <select id="order-dir">
        <option value="desc">↓</option>
        <option value="asc">↑</option>
      </select>
    </div>
  </div>
</div>

<div id="board"><div class="loading">Cargando solicitudes…</div></div>
<div id="status-bar"></div>

</div><!-- /#app -->

<script>
const SUPABASE_URL = "https://kzeculiumpoaeoanwscd.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt6ZWN1bGl1bXBvYWVvYW53c2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MTAwODAsImV4cCI6MjA5NTk4NjA4MH0.egJ7PLjP7bWJ5Cs9xp7uZ9sECNiOfDx29d03Cs2rZQE";

const STATUS_ORDER = [
  "Nueva","En análisis","Cotización en proceso","Cotización enviada","En negociación",
  "Ganada - en ejecución","Facturado - pendiente de cobro",
  "Perdida / Descartada - No viable","Pagada - Cerrada"
];

let ALL_ROWS = [];

// ---- Sesión (Supabase Auth) ----
const SESSION_KEY = "prs_solicitudes_session";
let SESSION = null;

function loadSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function saveSession(s){
  SESSION = s;
  try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch(e){}
}
function clearSession(){
  SESSION = null;
  try{ localStorage.removeItem(SESSION_KEY); } catch(e){}
}

async function authRequest(grantType, body){
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=" + grantType, {
    method: "POST",
    headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || "No se pudo iniciar sesión.");
  return data;
}

async function doLogin(email, password){
  const data = await authRequest("password", { email, password });
  saveSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    expires_at: Date.now() + (data.expires_in * 1000),
    email: (data.user && data.user.email) || email
  });
}

async function doRefresh(){
  if(!SESSION || !SESSION.refresh_token) return false;
  try{
    const data = await authRequest("refresh_token", { refresh_token: SESSION.refresh_token });
    saveSession({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in * 1000),
      email: (data.user && data.user.email) || SESSION.email
    });
    return true;
  } catch(e){ return false; }
}

// Devuelve true si hay una sesión válida (refrescándola si está por vencer).
async function ensureSession(){
  SESSION = loadSession();
  if(!SESSION) return false;
  if(Date.now() > SESSION.expires_at - 120000){
    const ok = await doRefresh();
    if(!ok){ clearSession(); return false; }
  }
  return true;
}

function showLogin(msg){
  document.getElementById("app").hidden = true;
  document.getElementById("login-screen").hidden = false;
  document.getElementById("login-error").textContent = msg || "";
}
function showApp(){
  document.getElementById("login-screen").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("session-email").textContent = SESSION.email || "";
}

function fmtMoney(n){
  if(n === null || n === undefined) return null;
  return "$" + Number(n).toLocaleString("es-MX", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return null;
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtPercent(n){
  if(n === null || n === undefined) return null;
  return Number(n).toLocaleString("es-MX", {minimumFractionDigits:1, maximumFractionDigits:1}) + "%";
}
function fmtDateTime(d){
  if(!d) return null;
  return new Date(d).toLocaleString("es-MX", {dateStyle:"medium", timeStyle:"short"});
}
function estadoClass(estado){
  if(estado === "Durango") return "durango";
  if(estado === "Sonora") return "sonora";
  return "";
}
function uniqueSorted(rows, field){
  return [...new Set(rows.map(r => r[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
}
function populateSelect(id, values, current){
  const sel = document.getElementById(id);
  const keep = current !== undefined ? current : sel.value;
  sel.innerHTML = '<option value="">' + sel.options[0].textContent + '</option>' +
    values.map(v => `<option value="${v}">${v}</option>`).join("");
  sel.value = keep && values.includes(keep) ? keep : "";
}

function populateFilterOptions(){
  populateSelect("f-cliente", uniqueSorted(ALL_ROWS, "cliente"));
  populateSelect("f-codigo", uniqueSorted(ALL_ROWS, "codigo"));
  populateSelect("f-estado", uniqueSorted(ALL_ROWS, "estado_republica"));
  populateSelect("f-unidad", uniqueSorted(ALL_ROWS, "unidad_negocio"));
  populateSelect("f-responsable", uniqueSorted(ALL_ROWS, "responsable"));
  populateSelect("f-canal", uniqueSorted(ALL_ROWS, "canal_entrada"));
  populateSelect("f-status", STATUS_ORDER.filter(s => ALL_ROWS.some(r => r.status === s)));
}

function updateSummary(rows){
  const summary = document.getElementById("summary");
  const activos = rows.filter(r => !["Pagada - Cerrada","Perdida / Descartada - No viable"].includes(r.status));
  const montoCotizado = rows.reduce((a,r)=> a + (Number(r.monto_cotizacion)||0), 0);
  const montoAutorizado = rows.reduce((a,r)=> a + (Number(r.precio_venta_autorizado)||0), 0);

  // Por cobrar: trabajo ya ejecutado que aún no se cobra (campo real de la BD, ya no un cálculo aproximado).
  const montoPorCobrar = rows.reduce((a,r)=> a + (Number(r.monto_pendiente_cobrar)||0), 0);

  // Por ejecutar: parte del contrato autorizado que aún no se ha trabajado (sin importar si ya se cobró anticipo).
  const montoPorEjecutar = rows.reduce((a,r)=> a + (Number(r.monto_pendiente_ejecutar)||0), 0);

  summary.innerHTML = `
    <div class="chip"><b>${rows.length}</b>Total</div>
    <div class="chip"><b>${activos.length}</b>Activas</div>
    <div class="chip"><b>${fmtMoney(montoCotizado) || "$0"}</b>Cotizado</div>
    <div class="chip"><b>${fmtMoney(montoAutorizado) || "$0"}</b>Autorizado</div>
    <div class="chip"><b>${fmtMoney(montoPorCobrar) || "$0"}</b>Por cobrar</div>
    <div class="chip ejecutar"><b>${fmtMoney(montoPorEjecutar) || "$0"}</b>Por ejecutar</div>
  `;
}

function applyFiltersAndSort(){
  const f = {
    cliente: document.getElementById("f-cliente").value,
    codigo: document.getElementById("f-codigo").value,
    estado_republica: document.getElementById("f-estado").value,
    unidad_negocio: document.getElementById("f-unidad").value,
    responsable: document.getElementById("f-responsable").value,
    canal_entrada: document.getElementById("f-canal").value,
    status: document.getElementById("f-status").value,
  };
  let rows = ALL_ROWS.filter(r => Object.keys(f).every(k => !f[k] || r[k] === f[k]));

  updateSummary(rows);

  const orderField = document.getElementById("order-field").value;
  const dir = document.getElementById("order-dir").value === "asc" ? 1 : -1;

  if(orderField !== "pipeline"){
    rows = [...rows].sort((a,b) => {
      let va = a[orderField], vb = b[orderField];
      const numeric = ["monto_cotizacion","costo_presupuestado"].includes(orderField);
      if(numeric){ va = Number(va)||0; vb = Number(vb)||0; return dir*(va-vb); }
      if(orderField === "created_at" || orderField === "fecha_termino_tentativa"){
        // nulls al final sin importar la dirección
        if(!va && !vb) return 0;
        if(!va) return 1;
        if(!vb) return -1;
        return dir*(new Date(va) - new Date(vb));
      }
      va = (va||"").toString(); vb = (vb||"").toString();
      return dir*va.localeCompare(vb,'es');
    });
  }
  renderBoard(rows, orderField === "pipeline");
}

function renderBoard(rows, groupByPipeline){
  const board = document.getElementById("board");
  board.innerHTML = "";

  if(!rows.length){
    board.innerHTML = '<div class="empty-board">Ninguna solicitud coincide con estos filtros.</div>';
    return;
  }

  if(groupByPipeline){
    const groups = {};
    rows.forEach(r => { (groups[r.status] = groups[r.status] || []).push(r); });
    STATUS_ORDER.filter(s => groups[s] && groups[s].length).forEach(status => {
      board.appendChild(buildColumn(status, groups[status]));
    });
  } else {
    board.appendChild(buildColumn("Resultados (" + rows.length + ")", rows));
  }
}

function buildColumn(title, items){
  const col = document.createElement("div");
  col.className = "col";
  col.innerHTML = `<div class="col-head"><h2>${title}</h2><span>${items.length}</span></div>`;
  items.forEach(r => col.appendChild(buildCard(r)));
  return col;
}

function buildCard(r){
  const card = document.createElement("div");
  card.className = "card " + estadoClass(r.estado_republica);

  // Campos siempre visibles: código, cliente, descripción, próxima acción y montos
  // (incluye utilidad/margen esperado y real — ya vienen null hasta que aplican, así que se ocultan solas).
  const montoLines = [
    ["Cotización", r.monto_cotizacion, "", fmtMoney],
    ["Costo presupuestado", r.costo_presupuestado, "", fmtMoney],
    ["Costo real", r.costo_real, "", fmtMoney],
    ["Precio de venta autorizado", r.precio_venta_autorizado, "", fmtMoney],
    ["Utilidad esperada", r.utilidad_esperada, "", fmtMoney],
    ["Margen esperado", r.margen_esperado, "", fmtPercent],
    ["Utilidad real", r.utilidad_real, "", fmtMoney],
    ["Margen real", r.margen_real, "", fmtPercent],
    ["Ejecutado", r.monto_ejecutado, "", fmtMoney],
    ["Pendiente de ejecutar", r.monto_pendiente_ejecutar, "ejecutar", fmtMoney],
    ["Facturado", r.monto_facturado, "", fmtMoney],
    ["Cobrado", r.monto_cobrado, "", fmtMoney],
    ["Pendiente de cobrar", r.monto_pendiente_cobrar, "cobrar", fmtMoney],
    ["Pendiente de facturar", r.monto_pendiente_facturar, "", fmtMoney],
  ].filter(([,v]) => v !== null && v !== undefined);

  // Campos secundarios: solo aparecen al hacer clic en "Ver detalle".
  const detailFields = [];
  if(r.descripcion && r.resumen_corto) detailFields.push(["Descripción completa", r.descripcion]);
  if(r.contacto) detailFields.push(["Contacto", r.contacto]);
  if(r.tipo_solicitud) detailFields.push(["Tipo de solicitud", r.tipo_solicitud]);
  if(r.canal_entrada) detailFields.push(["Canal de entrada", r.canal_entrada]);
  if(r.notas) detailFields.push(["Notas", r.notas, "notas"]);
  if(r.nombre_tarea) detailFields.push(["Nombre de tarea", r.nombre_tarea]);
  if(r.clickup_url) detailFields.push(["ClickUp", `<a href="${r.clickup_url}" target="_blank" rel="noopener">Ver tarea original ↗</a>`]);
  if(r.created_at) detailFields.push(["Fecha de captura", fmtDateTime(r.created_at)]);
  if(r.updated_at) detailFields.push(["Última actualización", fmtDateTime(r.updated_at)]);
  const hasDetail = detailFields.length > 0;

  card.innerHTML = `
    <div class="cliente">${r.cliente || "(sin cliente)"}</div>
    <div class="codigo">${r.codigo || ""} · ${r.status}</div>
    <div class="meta">
      ${r.estado_republica ? `<span class="tag">${r.estado_republica}</span>` : ""}
      ${r.unidad_negocio ? `<span class="tag">${r.unidad_negocio}</span>` : ""}
      ${r.responsable ? `<span class="tag resp">${r.responsable}</span>` : ""}
    </div>
    ${(r.resumen_corto || r.descripcion) ? `<div class="descripcion">${r.resumen_corto || r.descripcion}</div>` : ""}
    ${montoLines.length ? `<div class="montos">${montoLines.map(([label,v,cls,fmt]) =>
      `<div class="monto-linea ${cls}"><span>${label}</span><b>${fmt(v)}</b></div>`
    ).join("")}</div>` : ""}
    ${r.proxima_accion ? `<div class="accion"><b>Próxima acción:</b> ${r.proxima_accion}</div>` : ""}
    ${r.fecha_termino_tentativa ? `<div class="termino">Término tentativo: ${fmtDate(r.fecha_termino_tentativa)}</div>` : ""}
    ${hasDetail ? `
      <div class="detail-toggle">▸ Ver detalle</div>
      <div class="detail" hidden>${detailFields.map(([label,val,cls]) =>
        `<div class="detail-line ${cls||""}"><span>${label}</span><div>${val}</div></div>`
      ).join("")}</div>
    ` : ""}
  `;

  if(hasDetail){
    const toggle = card.querySelector(".detail-toggle");
    const detail = card.querySelector(".detail");
    toggle.addEventListener("click", () => {
      const willShow = detail.hidden;
      detail.hidden = !willShow;
      toggle.textContent = willShow ? "▾ Ocultar detalle" : "▸ Ver detalle";
    });
  }

  return card;
}

async function loadData(){
  const board = document.getElementById("board");
  const summary = document.getElementById("summary");
  const subtitle = document.getElementById("subtitle");
  const statusBar = document.getElementById("status-bar");
  board.innerHTML = '<div class="loading">Cargando solicitudes…</div>';

  const ok = await ensureSession();
  if(!ok){ showLogin("Tu sesión expiró o cerró. Vuelve a entrar."); return; }

  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/solicitudes?select=*&order=created_at.asc",
      { headers: { apikey: ANON_KEY, Authorization: "Bearer " + SESSION.access_token } }
    );
    if(res.status === 401 || res.status === 403){
      clearSession();
      showLogin("Tu sesión expiró o cerró. Vuelve a entrar.");
      return;
    }
    if(!res.ok) throw new Error("HTTP " + res.status);
    ALL_ROWS = await res.json();

    populateFilterOptions();
    applyFiltersAndSort();

    subtitle.textContent = ALL_ROWS.length + " solicitudes registradas · datos en vivo";
    statusBar.textContent = "Última actualización: " + new Date().toLocaleString("es-MX");
  } catch(err){
    board.innerHTML = '<div class="error">No se pudo cargar la información (' + err.message + '). Verifica que el proyecto de Supabase esté activo, e intenta actualizar.</div>';
    subtitle.textContent = "Error de conexión";
  }
}

["f-cliente","f-codigo","f-estado","f-unidad","f-responsable","f-canal","f-status","order-field","order-dir"]
  .forEach(id => document.getElementById(id).addEventListener("change", applyFiltersAndSort));

document.getElementById("clearFilters").addEventListener("click", () => {
  ["f-cliente","f-codigo","f-estado","f-unidad","f-responsable","f-canal","f-status"]
    .forEach(id => document.getElementById(id).value = "");
  document.getElementById("order-field").value = "pipeline";
  applyFiltersAndSort();
});

document.getElementById("refresh").addEventListener("click", loadData);

document.getElementById("logout").addEventListener("click", () => {
  clearSession();
  showLogin();
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const btn = document.getElementById("login-submit");
  const errorBox = document.getElementById("login-error");
  errorBox.textContent = "";
  btn.disabled = true;
  btn.textContent = "Entrando…";
  try {
    await doLogin(email, password);
    showApp();
    loadData();
  } catch(err){
    errorBox.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});

(async () => {
  const ok = await ensureSession();
  if(ok){ showApp(); loadData(); }
  else { showLogin(); }
})();
</script>
